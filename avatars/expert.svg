<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7e5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- 头部轮廓 -->
  <circle cx="100" cy="80" r="32" fill="#ffffff" opacity="0.95"/>
  <!-- 身体轮廓 -->
  <path d="M 40 200 Q 40 140 100 140 Q 160 140 160 200 Z" fill="#ffffff" opacity="0.95"/>
  <!-- 领带/领结 - 战略感 -->
  <path d="M 92 140 L 100 155 L 108 140 L 108 175 L 100 185 L 92 175 Z" fill="#ff7e5f" opacity="0.8"/>
  <!-- 眼睛 - 简洁专业 -->
  <circle cx="89" cy="78" r="4" fill="#333333"/>
  <circle cx="111" cy="78" r="4" fill="#333333"/>
  <!-- 微笑 -->
  <path d="M 88 92 Q 100 100 112 92" stroke="#333333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 思考气泡 - 代表决策 -->
  <g opacity="0.9">
    <circle cx="155" cy="50" r="18" fill="#ffffff"/>
    <circle cx="148" cy="72" r="5" fill="#ffffff"/>
    <circle cx="143" cy="82" r="3" fill="#ffffff"/>
    <text x="155" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff7e5f" font-family="Arial, sans-serif">S</text>
  </g>
</svg>
